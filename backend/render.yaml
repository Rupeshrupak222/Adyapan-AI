services:
  - type: web
    name: adyapan-ai-backend
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma generate --schema=prisma/schema.user.prisma && npm run build
    startCommand: node --max-old-space-size=900 dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=900
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: MASTER_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_REGISTER_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://adyapan-ai-gamma.vercel.app
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        sync: false
      - key: NEON_BRANCH_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
